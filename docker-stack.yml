# Docker Swarm stack for the DigitalOcean droplet.
#
# The droplet already runs another Swarm stack (`webimove`) with its own
# Traefik, Postgres and two frontends, live on clientes.webimove.com. This
# deploys beside it rather than over it: nothing here touches that stack, and
# the two APIs do not collide because they answer on different path prefixes -
# the old one on /v1, this one on /api/v1.
#
# The database is MongoDB Atlas, configured through MONGODB_URI in .env on the
# droplet. Nothing here overrides it: the connection string is a secret and
# belongs in that file, not in a repository.
#
# Deploy:
#   docker build -t moob-backend:latest . && docker stack deploy -c docker-stack.yml --resolve-image never moob
#
# `docker compose up` is the wrong tool here - the node is a Swarm manager and
# Traefik discovers routes from *service* labels, which only exist under
# `deploy:`. Container labels are invisible to it.

services:
  api:
    image: moob-backend:latest
    build: .
    # Everything comes from here, MONGODB_URI included. Deliberately not
    # repeated under `environment:` below - that key wins over env_file, so a
    # value left there silently overrides whatever the operator configured.
    env_file: .env
    environment:
      # Traefik terminates TLS and forwards; without this every caller looks
      # like the proxy, which breaks the login throttle and the audit trail.
      TRUST_PROXY_HEADERS: "true"
      # Atlas is not on this machine, so a cold pool costs a full TLS handshake
      # - three or four round trips - on the first query after an idle spell.
      # Holding a few connections open is what stops that showing up in
      # somebody's login.
      MONGO_MIN_POOL_SIZE: "5"
    networks:
      # Traefik's own network. The API needs no other: the database is remote.
      - webimove_internal
    deploy:
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.docker.network: webimove_internal

        # The REST API. A different prefix from the old backend's /v1, so both
        # answer on the same host without either being rerouted.
        traefik.http.routers.moobapi.entrypoints: websecure
        traefik.http.routers.moobapi.rule: "Host(`clientes.webimove.com`) && PathPrefix(`/api`)"
        traefik.http.routers.moobapi.tls: "true"
        traefik.http.routers.moobapi.tls.certresolver: letsencrypt

        # Socket.IO is a separate path and therefore a separate router. Traefik
        # upgrades WebSocket connections on its own - no extra configuration -
        # but it will not route a path no router claims, and live messaging is
        # silently dead when this is missing.
        traefik.http.routers.moobsocket.entrypoints: websecure
        traefik.http.routers.moobsocket.rule: "Host(`clientes.webimove.com`) && PathPrefix(`/socket.io`)"
        traefik.http.routers.moobsocket.tls: "true"
        traefik.http.routers.moobsocket.tls.certresolver: letsencrypt

        traefik.http.services.moobapi.loadbalancer.server.port: "8000"
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure

networks:
  # Traefik's network, created by the stack that already runs here. External,
  # because this file must never try to own or recreate it.
  webimove_internal:
    external: true
