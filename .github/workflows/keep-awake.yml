# Wakes the API if it has gone to sleep.
#
# This is the *recovery net*, not the main keep-alive. The two are different
# jobs, and it matters which is which:
#
#   app/services/keepalive.py   pings every 12 minutes from inside the running
#                               container. This is what actually keeps the
#                               service up - it is frequent enough to sit inside
#                               Render's 15-minute idle window. But it is the
#                               process that gets stopped, so it cannot revive
#                               itself.
#   this workflow               runs on GitHub's machines, so it still fires when
#                               the service is down. That is the one thing the
#                               in-app pinger cannot do, and the only reason this
#                               exists.
#
# Because its job is recovery rather than prevention, it runs every 30 minutes
# instead of every 10 - which also keeps it inside the free Actions allowance.
# See the note on minutes below before shortening that interval.
#
# ── This job never fails ──────────────────────────────────────────────────
#
# On purpose. GitHub emails the repository owner every time a *scheduled* run
# fails, and a keep-alive that pings on a timer forever will fail sometimes:
# mid-deploy, during a cold start, whenever Render has a bad minute. Reporting
# each of those as a build failure means an inbox full of alerts that are not
# actionable, which is how real alerts get ignored.
#
# So the outcome goes to the run summary and to warning annotations instead, and
# the step exits 0 either way. Open the Actions tab to see what happened; look at
# `uptime_seconds` in the summary to see whether the pinging is working at all.
#
# ── Actions minutes ───────────────────────────────────────────────────────
#
# Public repo: unlimited and free, ignore this.
#
# Private repo: 2,000 minutes a month free, and GitHub bills each run rounded UP
# to a whole minute no matter how fast it was. So the interval is a budget:
#
#     every 30 min → ~1,440 runs → ~1,440 min/month  ✅ fits
#     every 15 min → ~2,880 runs → over budget       ❌
#     every 10 min → ~4,320 runs → well over         ❌
#
# Which is the real reason this cannot be the primary keep-alive on a private
# repo. If you want a reliable 10-minute ping, use a free uptime monitor -
# cron-job.org or UptimeRobot on https://moob.onrender.com/ping. They fire on
# time, cost nothing, and have no minute budget.
#
# ── Configuration ─────────────────────────────────────────────────────────
#
# None required - the URL below matches what the app is built against. To point
# it somewhere else, set an API_URL repository variable: Settings → Secrets and
# variables → Actions → Variables → New repository variable. A variable rather
# than a secret, because a masked URL makes a failing ping much harder to read.
name: Keep the API awake

on:
  schedule:
    - cron: '*/30 * * * *'
  # Actions tab → this workflow → Run workflow, to test without waiting.
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

# Nothing here reads or writes the repository.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # A cold start can take most of a minute; this bounds the retries without
    # letting a hung request burn minutes.
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          # The repository variable when set, the app's production URL otherwise.
          # Defaulting rather than failing is deliberate: the previous version
          # exited 1 when the variable was missing, which turned a setup step
          # nobody had done into a failure email every half hour.
          API_URL: ${{ vars.API_URL || 'https://moob.onrender.com' }}
        run: |
          set -uo pipefail

          target="${API_URL%/}/ping"
          echo "Pinging ${target}"

          status=""
          payload=""
          # Retries because the first request is the one that wakes a sleeping
          # instance, and it can time out while the container is still starting.
          for attempt in 1 2 3; do
            # --max-time, not --connect-timeout: waking is slow to answer, not
            # slow to connect.
            response=$(curl --silent --show-error --location --max-time 90 \
                            --write-out '\n%{http_code}' "${target}" 2>&1) && rc=0 || rc=$?
            status=$(printf '%s' "${response}" | tail -n1)
            payload=$(printf '%s' "${response}" | sed '$d')

            if [ "${rc}" -eq 0 ] && [ "${status}" = "200" ]; then
              break
            fi
            echo "Attempt ${attempt}: curl exit ${rc}, HTTP ${status:-none}"
            [ "${attempt}" -lt 3 ] && sleep 20
          done

          {
            echo "### Keep-awake ping"
            echo
            echo "- Target: \`${target}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${status}" = "200" ]; then
            echo "Awake (HTTP 200)"
            echo "${payload}"

            # uptime_seconds is the honest signal. Large and growing means the
            # in-app keep-alive is holding the service up on its own. Small on
            # every run means each of these pings is waking a service that had
            # already gone back to sleep - the in-app pinger is not working, and
            # a 10-minute external monitor is what you actually need.
            uptime=$(printf '%s' "${payload}" \
              | grep -o '"uptime_seconds":[0-9.]*' | cut -d: -f2 || true)

            {
              echo "- Result: **awake** (HTTP 200)"
              [ -n "${uptime}" ] && echo "- Uptime: \`${uptime}s\`"
              echo
              echo '```json'
              echo "${payload}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # A warning, not an error: an unreachable API for one tick is not a
            # broken repository, and this must not become a failure email.
            echo "::warning title=API did not answer::${target} returned no 200 after 3 attempts (last: HTTP ${status:-none}). If this repeats for hours, check the Render dashboard."
            {
              echo "- Result: **no answer** after 3 attempts (last HTTP \`${status:-none}\`)"
              echo
              echo "If this repeats across several runs, check whether the Render"
              echo "service is suspended - a free account gets 750 instance-hours"
              echo "a month across all its free services, and they stop when it"
              echo "runs out."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Always. See "This job never fails" at the top of this file.
          exit 0
