# Deploy to the DigitalOcean droplet on every push to main.
#
# The image is built *on the droplet* rather than pushed from here. That is one
# fewer moving part than a registry: no GHCR package to make visible, no pull
# credentials to keep on the server, and no way for the running stack and the
# built image to disagree about which commit they are. The droplet has 8 GB and
# four cores, so a build costs it a couple of minutes of CPU it is not otherwise
# using.
#
# ── One-time setup ────────────────────────────────────────────────────────
#
# On the droplet, as root:
#
#   1. Clone the repository to /opt/moob (needs a deploy key for a private repo)
#   2. Write /opt/moob/.env - it is never in git and this workflow never touches
#      it, so secrets stay on the server and a deploy cannot overwrite them
#   3. Authorise the key this workflow uses:
#        ssh-keygen -t ed25519 -f deploy_key -N ""     # on your own machine
#        cat deploy_key.pub >> ~/.ssh/authorized_keys  # on the droplet
#
# Then in GitHub → Settings → Secrets and variables → Actions → New repository
# secret:
#
#   DROPLET_HOST       188.166.132.64        (the Reserved IP, not the droplet's own)
#   DROPLET_USER       root
#   DROPLET_SSH_KEY    the whole private deploy_key file, BEGIN/END lines included
#
# ── Why the tests gate this ───────────────────────────────────────────────
#
# `needs: test` means a red suite stops the deploy instead of shipping past it.
# The same suite runs in ci.yml for branches; this re-run is what makes main's
# result the one the deploy is standing on.
name: Deploy

on:
  push:
    branches: [main]
  # Actions tab → Deploy → Run workflow, to redeploy without a commit.
  workflow_dispatch:

concurrency:
  # Never two deploys at once. `cancel-in-progress: false` because a half-applied
  # deploy is worse than a slow one - let the first finish, then run the second.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Load the SSH key
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key on first contact rather than disabling the check.
          # StrictHostKeyChecking=no would accept whatever answers on that IP,
          # which is the whole protection this file relies on.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build and roll out
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd /opt/moob

          # --ff-only: refuse rather than merge. A deploy that quietly resolves
          # a conflict against edits made on the server is how a server ends up
          # running something that exists in no commit.
          git fetch --prune origin main
          git checkout main
          git merge --ff-only origin/main
          TAG=\$(git rev-parse --short=7 HEAD)
          echo "Deploying \$TAG"

          # Tagged by commit, not :latest. With a fixed tag the service spec was
          # identical on every deploy, so Swarm changed nothing and the old
          # container kept serving while this job went green.
          docker build -t moob-backend:\$TAG -t moob-backend:latest .

          # --resolve-image never: the image is local, there is no registry to
          # look a digest up in.
          IMAGE_TAG=\$TAG docker stack deploy -c docker-stack.yml --resolve-image never moob

          # Old images pile up at a few hundred MB per deploy otherwise.
          docker image prune -f --filter "until=168h" >/dev/null || true
          REMOTE

      - name: Wait for it to answer
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Swarm replaces the task rather than restarting it, so there is a
          # window where the old container is going and the new one is not up.
          #
          # Asked from *inside* the container, for two reasons. The service
          # publishes no ports - Traefik reaches it over an overlay network -
          # so nothing is listening on the droplet's own localhost. And
          # /health sits at the app root rather than under /api, the only
          # prefix Traefik routes here, so it has no public address either.
          #
          # Python rather than curl: the image is python:3.12-slim, which
          # ships no curl.
          #
          # 20s, not 5: /health pings Atlas, and the driver's own server
          # selection timeout is 5s. A probe that gives up at the same
          # moment can only ever report a timeout - never the answer,
          # which is the one thing worth reading.
          probe='import urllib.request as u; print(u.urlopen("http://localhost:8000/health", timeout=20).read().decode())'
          # Healthy is not enough: the old container was healthy too, which is
          # how a deploy that changed nothing passed. The running task has to be
          # on this commit's image before its health counts.
          want="moob-backend:${SHA:0:7}"
          for attempt in $(seq 1 20); do
            running=$(ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
              "docker ps --filter name=moob_api --format '{{.Image}}' | head -1" 2>/dev/null || true)
            body=""
            if [ "$running" = "$want" ]; then
              body=$(ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
                "docker exec \$(docker ps -qf name=moob_api) python -c '${probe}'" 2>/dev/null || true)
            fi
            case "$body" in
              *'"database":true'*|*'"database": true'*)
                echo "Healthy on $running: $body"
                echo "### Deployed $running and healthy" >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
            echo "Attempt ${attempt}: running ${running:-nothing}, want ${want} (${body:-not checked})"
            sleep 10
          done

          # Loud on purpose, unlike the keep-alive workflow: this one is
          # actionable - a deploy just went out and the API is not answering.
          echo "::error title=Deploy did not come up::the new image never came up healthy after ~3 minutes."
          ssh -i ~/.ssh/deploy_key "${USER}@${HOST}" \
            "docker service logs moob_api --tail 60" || true
          exit 1

      - name: Forget the key
        # Runners are disposable, but a failed job that leaves a private key on
        # disk is a habit worth not having.
        if: always()
        run: rm -f ~/.ssh/deploy_key
